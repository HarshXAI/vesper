name: Dependency Updates

on:
  schedule:
    # Run weekly on Monday at 3 AM UTC
    - cron: '0 3 * * 1'
  workflow_dispatch:

jobs:
  check-dependencies:
    name: Check for Dependency Updates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      
      - name: Install pip-audit
        run: |
          pip install pip-audit pip-tools
      
      - name: Audit dependencies for security issues
        run: |
          echo "## Dependency Security Audit" > audit-report.md
          echo "" >> audit-report.md
          
          find . -name "requirements.txt" -type f | while read req; do
            echo "### $req" >> audit-report.md
            pip-audit -r "$req" --format json > audit.json || true
            if [ -s audit.json ]; then
              echo "⚠️ Vulnerabilities found" >> audit-report.md
              python -m json.tool audit.json >> audit-report.md
            else
              echo "✅ No known vulnerabilities" >> audit-report.md
            fi
            echo "" >> audit-report.md
          done
      
      - name: Check for outdated packages
        run: |
          echo "## Outdated Packages" >> audit-report.md
          echo "" >> audit-report.md
          
          find . -name "requirements.txt" -type f | while read req; do
            echo "### $req" >> audit-report.md
            pip install -r "$req" > /dev/null 2>&1 || true
            pip list --outdated --format json > outdated.json || true
            if [ -s outdated.json ] && [ "$(cat outdated.json)" != "[]" ]; then
              echo "Packages with available updates:" >> audit-report.md
              python -m json.tool outdated.json >> audit-report.md
            else
              echo "✅ All packages up to date" >> audit-report.md
            fi
            echo "" >> audit-report.md
          done
      
      - name: Upload audit report
        uses: actions/upload-artifact@v4
        with:
          name: dependency-audit-report
          path: audit-report.md
      
      - name: Comment on issue if vulnerabilities found
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const report = fs.readFileSync('audit-report.md', 'utf8');
            
            // Create or update issue
            const issues = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: ['dependencies', 'security']
            });
            
            const body = `# 🔒 Dependency Security Update Required\n\n${report}\n\n---\nGenerated on: ${new Date().toISOString()}`;
            
            if (issues.data.length > 0) {
              // Update existing issue
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issues.data[0].number,
                body: body
              });
            } else {
              // Create new issue
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title: '🔒 Security vulnerabilities in dependencies',
                body: body,
                labels: ['dependencies', 'security']
              });
            }
