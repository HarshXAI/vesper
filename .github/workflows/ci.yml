name: CI Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

env:
  PYTHON_VERSION: "3.11"
  NODE_VERSION: "20"

jobs:
  # Lint and format check for Python services
  python-lint:
    name: Python Lint & Format Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: "pip"

      - name: Install linting dependencies
        run: |
          pip install black flake8 isort mypy pylint

      - name: Check code formatting with Black
        run: |
          black --check --diff services/ apps/ scripts/ orchestration/dags/ || true

      - name: Check import sorting with isort
        run: |
          isort --check-only --diff services/ apps/ scripts/ orchestration/dags/ || true

      - name: Lint with flake8
        run: |
          flake8 services/ apps/ scripts/ orchestration/dags/ --max-line-length=120 --extend-ignore=E203,W503 || true

      - name: Type check with mypy
        run: |
          mypy services/ apps/ --ignore-missing-imports || true

  # Test Python services
  python-tests:
    name: Python Unit Tests
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [ingestion, processing, api-gateway]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: "pip"

      - name: Install service dependencies - ${{ matrix.service }}
        run: |
          if [ -f "services/${{ matrix.service }}/requirements.txt" ]; then
            pip install -r services/${{ matrix.service }}/requirements.txt
          elif [ -f "apps/${{ matrix.service }}/requirements.txt" ]; then
            pip install -r apps/${{ matrix.service }}/requirements.txt
          fi
          pip install pytest pytest-cov pytest-asyncio

      - name: Run tests - ${{ matrix.service }}
        run: |
          if [ -d "services/${{ matrix.service }}/tests" ]; then
            cd services/${{ matrix.service }} && pytest tests/ -v --cov --cov-report=xml || true
          elif [ -d "apps/${{ matrix.service }}/tests" ]; then
            cd apps/${{ matrix.service }} && pytest tests/ -v --cov --cov-report=xml || true
          else
            echo "No tests found for ${{ matrix.service }}"
          fi

  # Security scanning
  security-scan:
    name: Security Vulnerability Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: "fs"
          scan-ref: "."
          format: "sarif"
          output: "trivy-results.sarif"
          severity: "CRITICAL,HIGH"
          exit-code: "0" # Don't fail the build on vulnerabilities

      - name: Upload Trivy results to GitHub Security tab
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: "trivy-results.sarif"

  # Docker build and test
  docker-build:
    name: Docker Build & Test
    runs-on: ubuntu-latest
    needs: [python-lint, python-tests]
    strategy:
      matrix:
        service:
          - name: ingestion
            path: services/ingestion
          - name: processing
            path: services/processing
          - name: api-gateway
            path: apps/api-gateway
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image - ${{ matrix.service.name }}
        uses: docker/build-push-action@v5
        with:
          context: ${{ matrix.service.path }}
          file: ${{ matrix.service.path }}/Dockerfile
          push: false
          tags: vesper-${{ matrix.service.name }}:test
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Scan Docker image with Trivy
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: vesper-${{ matrix.service.name }}:test
          format: "table"
          exit-code: "0"
          severity: "CRITICAL,HIGH"

  # Airflow DAG validation
  airflow-dag-validation:
    name: Validate Airflow DAGs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: "pip"

      - name: Install Airflow
        run: |
          pip install apache-airflow==2.8.0 -c orchestration/requirements.txt || true

      - name: Validate DAG syntax
        run: |
          cd orchestration/dags
          for dag in *.py; do
            echo "Validating $dag..."
            python -c "import sys; sys.path.insert(0, '.'); exec(open('$dag').read())" || echo "Warning: $dag validation failed"
          done

  # All checks passed
  all-checks-passed:
    name: All CI Checks Passed
    runs-on: ubuntu-latest
    needs:
      [
        python-lint,
        python-tests,
        security-scan,
        docker-build,
        airflow-dag-validation,
      ]
    if: always()
    steps:
      - name: Check if all jobs succeeded
        run: |
          if [[ "${{ needs.python-lint.result }}" == "success" ]] && \
             [[ "${{ needs.python-tests.result }}" == "success" ]] && \
             [[ "${{ needs.security-scan.result }}" == "success" ]] && \
             [[ "${{ needs.docker-build.result }}" == "success" ]] && \
             [[ "${{ needs.airflow-dag-validation.result }}" == "success" ]]; then
            echo "✅ All CI checks passed!"
            exit 0
          else
            echo "❌ Some CI checks failed"
            exit 1
          fi
